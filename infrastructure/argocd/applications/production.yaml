apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lyberakis/devops-challenge-dustin.git
    targetRevision: HEAD
    path: charts/hello-world
    helm:
      releaseName: hello-production
      valueFiles:
        - values-production.yaml
        - values-production-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
