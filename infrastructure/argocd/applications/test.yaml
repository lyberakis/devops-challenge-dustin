apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lyberakis/devops-challenge-dustin.git
    targetRevision: HEAD
    path: charts/hello-world
    helm:
      releaseName: hello-test
      valueFiles:
        - values-test.yaml
        - values-test-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
