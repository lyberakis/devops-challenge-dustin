replicaCount: 1

image:
  repository: devops-challenge-dustin
  tag: local
  pullPolicy: IfNotPresent

config:
  environment: test
  logLevel: DEBUG
  port: 8080

sealedSecret:
  enabled: false
  name: hello-world-secrets
  encryptedData: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

ingress:
  host: ""

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
