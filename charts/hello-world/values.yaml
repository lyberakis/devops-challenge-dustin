replicaCount: 1

image:
  repository: ghcr.io/lyberakis/devops-challenge-dustin
  pullPolicy: IfNotPresent

config:
  port: 8080

sealedSecret:
  enabled: false
  name: hello-world-secrets
  encryptedData: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 512Mi

ingress:
  host: ""

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
