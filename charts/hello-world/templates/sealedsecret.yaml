{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  encryptedData:
    API_KEY: {{ required "sealedSecret.encryptedData.API_KEY is required when sealedSecret.enabled=true" .Values.sealedSecret.encryptedData.API_KEY | quote }}
  template:
    metadata:
      name: {{ .Values.sealedSecret.name | quote }}
      namespace: {{ .Release.Namespace | quote }}
    type: Opaque
{{- end }}
