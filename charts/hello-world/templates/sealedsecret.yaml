{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  encryptedData:
    {{- range $key, $value := .Values.sealedSecret.encryptedData }}
    {{ $key }}: {{ required (printf "sealedSecret.encryptedData.%s must not be empty" $key) $value | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ .Values.sealedSecret.name | quote }}
      namespace: {{ .Release.Namespace | quote }}
    type: Opaque
{{- end }}
