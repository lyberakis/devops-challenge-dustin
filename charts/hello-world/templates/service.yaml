apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-world.name" . }}
  labels:
    {{ include "hello-world.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{ include "hello-world.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
