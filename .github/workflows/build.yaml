name: Build

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: devops-challenge-dustin:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image and run unit tests
        run: docker build --tag "$IMAGE" .

      - name: Save image
        run: docker save --output image.tar "$IMAGE"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: devops-challenge-dustin:${{ github.sha }}
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load --input image.tar

      - name: Smoke test the image
        shell: bash
        run: |
          docker run --detach --name app --publish 127.0.0.1:8080:8080 --env ENVIRONMENT=ci "$IMAGE"
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 120 --max-time 5 --output health.json http://127.0.0.1:8080/health
          jq --exit-status '.status == "healthy"' health.json
          curl --fail --show-error --max-time 5 http://127.0.0.1:8080/ > response.json
          jq --exit-status '.message == "Hello, World!" and .environment == "ci"' response.json

      - name: Show container logs
        if: failure()
        run: docker logs app 2>&1 || true

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: image.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: table
          timeout: 10m

  publish:
    needs: [test, security-scan]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: devops-challenge-dustin:${{ github.sha }}
      GHCR_IMAGE: ghcr.io/lyberakis/devops-challenge-dustin:${{ github.sha }}
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load --input image.tar

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish image
        run: |
          docker tag "$IMAGE" "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"

  deploy:
    needs: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Update test image tag and commit
        uses: actions/github-script@v8
        with:
          script: |
            const branch = context.payload.repository.default_branch;
            const path = 'charts/hello-world/values-test.yaml';
            const { data: head } = await github.rest.repos.getBranch({ ...context.repo, branch });
            
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path, ref: context.sha });
            const content = Buffer.from(file.content, 'base64').toString('utf8');
            const pattern = /^(image:\r?\n  tag: )[^\r\n]+/m;
            
            const updated = content.replace(pattern, `$1"${context.sha}"`);
            if (updated === content) return;
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              branch,
              sha: file.sha,
              message: `Deploy test image ${context.sha}`,
              content: Buffer.from(updated).toString('base64'),
            });
